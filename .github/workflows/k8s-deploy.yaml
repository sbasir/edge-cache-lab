name: Deploy to Kubernetes
run-name: "Deploy to k3s (ref: ${{ github.ref_name }})"

on:
  workflow_dispatch:
    # No inputs - use git ref selector to choose tag

permissions: {}


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.extract.outputs.image_tag }}
    steps:
      - name: Extract and validate tag
        id: extract
        run: |
          REF_NAME="${{ github.ref_name }}"
          echo "Reference name: $REF_NAME"

          # Allow semantic version tags with optional suffix (e.g., v1.2.3 or v1.2.3-testing)
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid reference. Please select a semantic version tag (e.g., v1.2.3 or v1.2.3-testing)"
            echo "::error::Got: $REF_NAME"
            exit 1
          fi

          version="${REF_NAME#v}"
          echo "image_tag=$version" >> "$GITHUB_OUTPUT"
          echo "✓ Valid semantic version tag: $REF_NAME -> image tag: $version"

  deploy:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    # Prevent concurrent deployments to production
    concurrency:
      group: k8s-deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Checkout repository
        if: ${{ env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: 'v1.31.4'

      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install session-manager-plugin
        run: |
          curl -sSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      - name: Configure AWS credentials via OIDC
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Configure AWS credentials (local test)
        if: ${{ env.ACT }}
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          output-credentials: true

      - name: Get Pulumi outputs
        id: pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: output
          stack-name: dev
          work-dir: infra/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy to k3s cluster
        if: ${{ !env.ACT }}
        run: |
          echo "Deploying version: ${{ needs.validate-tag.outputs.image_tag }}"
          make k8s-remote-up \
            INSTANCE_ID="${{ steps.pulumi.outputs.instance_id }}" \
            IMAGE_TAG="${{ needs.validate-tag.outputs.image_tag }}"

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully"
          echo "Version: ${{ needs.validate-tag.outputs.image_tag }}"
          echo "Instance: ${{ steps.pulumi.outputs.instance_id }}"

      # TODO: Add smoke tests to validate the deployment
      # - name: Run smoke tests
      #   run: |
      #     make validate-endpoints
