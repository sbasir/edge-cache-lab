name: Infra Up

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Pulumi stack to deploy'
        required: false
        default: 'dev'
        type: string

permissions: {}


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write  # AWS OIDC
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: infra/pulumi
          github-token: ${{ github.token }}
          activate-environment: true

      - name: Configure AWS credentials via OIDC
        if: ${{ !env.ACT }} # skip when running under act
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials (local)
        if: ${{ env.ACT }} # only run under act
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          output-credentials: true

      - name: Cache Pulumi venv
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            infra/pulumi/.venv
            infra/pulumi/venv
          key: pulumi-venv-${{ runner.os }}-${{ hashFiles('infra/pulumi/pyproject.toml') }}

      - name: Cache Pulumi plugins
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}

      - name: Install dependencies
        run: |
          cd infra/pulumi
          uv sync
          cp -r .venv/ venv/

      - name: Deploy with Pulumi
        if: ${{ !env.ACT || env.FORCE == 'true' }} # skip when running under act if FORCE is not true
        id: pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: ${{ inputs.stack }}
          work-dir: infra/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Update Cloudflare DNS
        if: ${{ !env.ACT || env.FORCE == 'true' }} # skip when running under act if FORCE is not true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_RECORD_NAME: ${{ vars.CF_API_RECORD_NAME }}
          CF_TTL: 300
          CF_PROXIED: false
          PUBLIC_IP: ${{ steps.pulumi.outputs.public_ip }}
        working-directory: infra/pulumi
        run: |
          bash ../scripts/cloudflare-set-dns.sh

      - name: Deployment Summary
        env:
          STACK: ${{ inputs.stack }}
          PUBLIC_IP: ${{ steps.pulumi.outputs.public_ip }}
          CF_API_RECORD_NAME: ${{ vars.CF_API_RECORD_NAME }}
        run: |
          {
            echo "### Deployment Complete ✅"
            echo ""
            echo "**Stack:** ${STACK}"
            echo "**Public IP:** ${PUBLIC_IP}"
            echo "**DNS Record:** ${CF_API_RECORD_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
