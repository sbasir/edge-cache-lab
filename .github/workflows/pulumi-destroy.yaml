name: Pulumi Destroy

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Pulumi stack to destroy'
        required: false
        default: 'dev'
        type: string

permissions:
  id-token: write  # Required for AWS OIDC
  contents: read

jobs:
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: infra/pulumi
          github-token: ${{ github.token }}
          activate-environment: true

      - name: Configure AWS credentials via OIDC
        if: ${{ !env.ACT }} # skip when running under act
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Configure AWS credentials (local) 
        if: ${{ env.ACT }} # only run under act 
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          output-credentials: true
          
      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          arch: amd64
          
      - name: Verify AWS credentials
        if: ${{ env.ACT }}
        run: |
          aws sts get-caller-identity --no-cli-pager

      - name: Cache Pulumi venv
        uses: actions/cache@v5
        with:
          path: | 
            infra/pulumi/.venv
            infra/pulumi/venv
          key: pulumi-venv-${{ runner.os }}-${{ hashFiles('infra/pulumi/pyproject.toml') }}
              
      - name: Cache Pulumi plugins
        uses: actions/cache@v5
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}

      - name: Install dependencies
        run: |
          cd infra/pulumi
          uv sync
          cp -r .venv/ venv/
      
      - name: Remove Cloudflare DNS Record
        if: ${{ !env.ACT || env.FORCE == 'true' }} # skip when running under act if FORCE is not true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_RECORD_NAME: ${{ vars.CF_RECORD_NAME }}
        run: |
          bash ./infra/scripts/cloudflare-remove-dns.sh || echo "DNS record removal failed or record does not exist"
      
      - name: Destroy with Pulumi
        if: ${{ !env.ACT || env.FORCE == 'true' }} # skip when running under act if FORCE is not true
        id: pulumi
        uses: pulumi/actions@v6
        with:
          command: destroy
          stack-name: ${{ inputs.stack }}
          # Non-interactive mode to prevent hanging
          work-dir: infra/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_SKIP_CONFIRMATIONS: true
      
      - name: Destruction Summary
        run: |
          echo "### Infrastructure Destroyed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stack:** ${{ inputs.stack }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** All resources have been destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** DNS record for \`${{ vars.CF_RECORD_NAME }}\` has been removed from Cloudflare" >> $GITHUB_STEP_SUMMARY
