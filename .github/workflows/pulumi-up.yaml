name: Pulumi Up

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Pulumi stack to deploy'
        required: false
        default: 'dev'
        type: string

permissions:
  id-token: write  # Required for AWS OIDC
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: infra/pulumi
          github-token: ${{ github.token }}
          activate-environment: true
      
      - name: Configure AWS credentials via OIDC
        if: ${{ !env.ACT }} # skip when running under act
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Configure AWS credentials (local) 
        if: ${{ env.ACT }} # only run under act 
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          output-credentials: true

      - name: Cache Pulumi venv
        uses: actions/cache@v5
        with:
          path: | 
            infra/pulumi/.venv
            infra/pulumi/venv
          key: pulumi-venv-${{ runner.os }}-${{ hashFiles('infra/pulumi/pyproject.toml') }}
              
      - name: Cache Pulumi plugins
        uses: actions/cache@v5
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}

      - name: Install dependencies
        run: |
          cd infra/pulumi
          uv sync
          cp -r .venv/ venv/
      
      - name: Deploy with Pulumi
        if: ${{ !env.ACT || env.FORCE == 'true' }} # skip when running under act if FORCE is not true
        id: pulumi
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ inputs.stack }}
          work-dir: infra/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Update Cloudflare DNS
        if: ${{ !env.ACT || env.FORCE == 'true' }} # skip when running under act if FORCE is not true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_RECORD_NAME: ${{ vars.CF_RECORD_NAME }}
          CF_TTL: 300
          CF_PROXIED: false
          PUBLIC_IP: ${{ steps.pulumi.outputs.public_ip }}
        run: |
          bash ./infra/scripts/cloudflare-set-dns.sh
      
      - name: Deployment Summary
        run: |
          echo "### Deployment Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stack:** ${{ inputs.stack }}" >> $GITHUB_STEP_SUMMARY
          echo "**Public IP:** ${{ steps.pulumi.outputs.public_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "**DNS Record:** ${{ vars.CF_RECORD_NAME }}" >> $GITHUB_STEP_SUMMARY
