name: Validate Kubernetes Manifests

on:
  push:
    branches:
      - main
    paths:
      - 'infra/k8s/**'
      - '.github/workflows/k8s-ci.yaml'
  pull_request:
    paths:
      - 'infra/k8s/**'
      - '.github/workflows/k8s-ci.yaml'

permissions: {}

# Cancel in-progress runs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create results directory for SARIF reports
        shell: bash
        run: mkdir -p ../results

      - name: Kube Linter Scan
        id: kube-lint-scan
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: infra/k8s
          fail-on-invalid-resource: true
          format: sarif
          output-file: ../results/kube-linter.sarif
        continue-on-error: true

      - name: Upload SARIF report to GitHub Security
        if: ${{ !env.ACT }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0

      - name: Verify kube-linter passed
        shell: bash
        run: |
          echo "If this step fails, kube-linter found issues. Check the scan output above."
          [[ "${{ steps.kube-lint-scan.outcome }}" == "success" ]]
