name: Validate Kubernetes Manifests

on:
  push:
    branches:
      - main
    paths:
      - 'infra/k8s/**'
      - '.github/workflows/k8s-ci.yaml'
  pull_request:
    paths:
      - 'infra/k8s/**'
      - '.github/workflows/k8s-ci.yaml'

permissions:
  contents: read
  actions: read
  security-events: write

# Cancel in-progress runs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create results directory for SARIF reports
        shell: bash
        run: mkdir -p ../results

      - name: Kube Linter Scan
        id: kube-lint-scan
        uses: stackrox/kube-linter-action@v1
        with:
          directory: infra/k8s
          fail-on-invalid-resource: true
          format: sarif
          output-file: ../results/kube-linter.sarif
        continue-on-error: true

      - name: Upload SARIF report to GitHub Security
        if: ${{ !env.ACT }}
        uses: github/codeql-action/upload-sarif@v4

      - name: Verify kube-linter passed
        shell: bash
        run: |
          echo "If this step fails, kube-linter found issues. Check the scan output above."
          [[ "${{ steps.kube-lint-scan.outcome }}" == "success" ]]