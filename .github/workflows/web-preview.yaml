# .github/workflows/web-preview.yaml — deploy a per-PR preview Worker, comment the URL.
#
# Requires:
#   - CF_API_TOKEN (secret) — "Edit Cloudflare Workers" token.
#   - A "preview" GitHub Environment (Settings → Environments).
# Setup instructions (token creation + Environment): see README.md →
#   "Web (Cloudflare Workers) deployment".
name: Web Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-preview.yaml'

permissions: {}

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Build Vite app
        working-directory: apps/web
        run: pnpm run build

      - name: Deploy preview to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: apps/web
          command: deploy --env preview

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: web-preview
          message: |
            ### 🚀 Preview Deployed

            **URL**: ${{ steps.deploy.outputs.deployment-url }}

            Updated for commit `${{ github.event.pull_request.head.sha }}`.
