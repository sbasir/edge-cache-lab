name: Build and Publish Container Images
run-name: "Build and publish images"

on:
  push:
    tags:
      - 'v*.*.*' # Semantic version tags (e.g., v1.2.3)
      - 'v*.*.*-*' # Semantic version tags with suffix (e.g., v1.2.3-test)
  workflow_call:
    inputs:
      release_tag:
        description: "Tag to publish (e.g., v1.2.3 or v1.2.3-test)"
        required: true
        type: string

# Least privilege permissions: read-only by default
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./apps/api
            sbom_file: sbom-api.spdx.json
          - component: varnish
            context: ./apps/varnish
            sbom_file: sbom-varnish.spdx.json
    
    concurrency:
      group: publish-${{ matrix.component }}-${{ github.ref }}
      cancel-in-progress: false
    
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.component }}
    
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ env.ACT }}" = "true" ]; then
            echo "Running in ACT environment, using dummy tag"
            echo "tag=v1.2.3-act" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$tag'. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-SUFFIX"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ !env.ACT }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Docker Buildx
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Compute image tags
        id: image-tags
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"

          tags=("${IMAGE}:${version}")
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            tags+=("${IMAGE}:${major}.${minor}")
            tags+=("${IMAGE}:${major}")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (labels)
        if: ${{ !env.ACT }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      
      - name: Build and push Docker image
        if: ${{ !env.ACT }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Generate artifact attestation
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Run Trivy vulnerability scanner
        if: ${{ !env.ACT }}
        uses: aquasecurity/trivy-action@0.34.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && !env.ACT }}
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM
        if: ${{ !env.ACT }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: 'spdx-json'
          output-file: ${{ matrix.sbom_file }}

      - name: Attest SBOM
        if: ${{ !env.ACT }}
        uses: actions/attest-sbom@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ matrix.sbom_file }}
          push-to-registry: true
      
