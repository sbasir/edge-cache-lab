name: Build and Publish Container Images
run-name: "Build and publish images"

on:
  push:
    tags:
      - 'v*.*.*' # Semantic version tags (e.g., v1.2.3)
      - 'v*.*.*-*' # Semantic version tags with suffix (e.g., v1.2.3-test)
  workflow_call:
    inputs:
      release_tag:
        description: "Tag to publish (e.g., v1.2.3 or v1.2.3-test)"
        required: true
        type: string
      dry_run:
        description: "Validate workflow and tag handling without pushing images"
        required: false
        default: false
        type: boolean

# Least privilege permissions: read-only by default
permissions: {}


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./apps/api
            sbom_file: sbom-api.spdx.json
          - component: varnish
            context: ./apps/varnish
            sbom_file: sbom-varnish.spdx.json

    concurrency:
      group: publish-${{ matrix.component }}-${{ github.ref }}
      cancel-in-progress: false

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.component }}

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            tag="$INPUT_RELEASE_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$tag'. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-SUFFIX"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Docker Buildx
        if: ${{ !(inputs.release_tag != '' && inputs.dry_run) }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container registry
        if: ${{ !(inputs.release_tag != '' && inputs.dry_run) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image-tags
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"

          tags=("${IMAGE}:${version}")
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            tags+=("${IMAGE}:${major}.${minor}")
            tags+=("${IMAGE}:${major}")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (labels)
        if: ${{ !(inputs.release_tag != '' && inputs.dry_run) }}
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        if: ${{ !(inputs.release_tag != '' && inputs.dry_run) }}
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: ${{ !(inputs.release_tag != '' && inputs.dry_run) }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Run Trivy vulnerability scanner
        if: ${{ !(inputs.release_tag != '' && inputs.dry_run) }}
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: ${{ always() && !(inputs.release_tag != '' && inputs.dry_run) }}
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM
        if: ${{ !(inputs.release_tag != '' && inputs.dry_run) }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: 'spdx-json'
          output-file: ${{ matrix.sbom_file }}

      - name: Attest SBOM
        if: ${{ !(inputs.release_tag != '' && inputs.dry_run) }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ matrix.sbom_file }}
          push-to-registry: true

      - name: Dry-run summary
        if: ${{ inputs.release_tag != '' && inputs.dry_run }}
        run: |
          echo "Dry run OK for component '${{ matrix.component }}'"
          echo "Validated release tag: ${{ steps.release.outputs.tag }}"
          echo "Computed image tags:"
          echo "${{ steps.image-tags.outputs.tags }}"
