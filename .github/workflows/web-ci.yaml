name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - '.github/workflows/web-ci.yaml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - '.github/workflows/web-ci.yaml'

permissions: {}

# Cancel in-progress runs for PRs, but not for main branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        working-directory: apps/web
        run: pnpm run dep-audit

      - name: Generate OpenAPI client
        working-directory: apps/web
        run: pnpm run generate-client

      - name: Check OpenAPI client drift
        run: git diff --exit-code -- apps/web/src/api

      - name: Lint
        working-directory: apps/web
        run: pnpm run lint

      - name: Build
        working-directory: apps/web
        run: pnpm run build

      - name: Build Docker image
        run: make web-docker-build IMAGE_TAG=ci-${{ github.sha }}
