name: Infra Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/pulumi/**'
      - '.github/workflows/infra-preview.yaml'

permissions:
  id-token: write  # Required for AWS OIDC
  contents: read
  pull-requests: write  # To post preview comments

jobs:
  preview:
    name: Preview Infrastructure Changes
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: infra/pulumi
          github-token: ${{ github.token }}
          activate-environment: true
      
      - name: Configure AWS credentials via OIDC
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials (local) 
        if: ${{ env.ACT }} # only run under act 
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          output-credentials: true

      - name: Cache Pulumi venv
        uses: actions/cache@v5
        with:
          path: | 
            infra/pulumi/.venv
            infra/pulumi/venv
          key: pulumi-venv-${{ runner.os }}-${{ hashFiles('infra/pulumi/pyproject.toml') }}
              
      - name: Cache Pulumi plugins
        uses: actions/cache@v5
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}

      - name: Install dependencies
        run: |
          cd infra/pulumi
          uv sync
          cp -r .venv/ venv/
      
      - name: Setup Pulumi
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: dev
          work-dir: infra/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
