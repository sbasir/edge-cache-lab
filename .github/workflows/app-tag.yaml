name: Create Release Tag
run-name: "Create tag (${{ github.event_name }})"

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      suffix:
        description: "Optional suffix to append to latest semver tag (e.g., testing => v1.2.3-testing)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Compute new tag
        id: compute
        env:
          SUFFIX: ${{ github.event.inputs.suffix || '' }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_base_tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$latest_base_tag" ]; then
            latest_base_tag="v0.0.0"
          fi

          suffix="$SUFFIX"

          if [ -n "$suffix" ]; then
            if [[ ! "$suffix" =~ ^[0-9A-Za-z.-]+$ ]]; then
              echo "::error::Invalid suffix '$suffix'. Allowed characters: [0-9A-Za-z.-]"
              exit 1
            fi
            new_tag="${latest_base_tag}-${suffix}"
          else
            version="${latest_base_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            new_patch=$((patch + 1))
            new_tag="v${major}.${minor}.${new_patch}"
          fi

          if git rev-parse "$new_tag" >/dev/null 2>&1; then
            echo "::error::Tag '$new_tag' already exists"
            exit 1
          fi

          echo "latest_base_tag=$latest_base_tag" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Computed new tag: $new_tag"

      - name: Create and push tag
        if: ${{ !env.ACT }}
        env:
          NEW_TAG: ${{ steps.compute.outputs.new_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Summary
        run: |
          if [ "${{ env.ACT }}" = "true" ]; then
            echo "ACT environment detected - skipping tag creation."
            echo "Computed tag: ${{ steps.compute.outputs.new_tag }}"
            echo "Based on latest semver: ${{ steps.compute.outputs.latest_base_tag }}"
            exit 0
          fi
          echo "Created tag: ${{ steps.compute.outputs.new_tag }}"
          echo "Based on latest semver: ${{ steps.compute.outputs.latest_base_tag }}"