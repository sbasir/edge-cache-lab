name: App CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/varnish/**'
      - 'openapi/**'
      - '.github/workflows/app-ci.yaml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/varnish/**'
      - 'openapi/**'
      - '.github/workflows/app-ci.yaml'

permissions: {}

# Cancel in-progress runs for PRs, but not for main branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Install tooling
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.1

      - name: OpenAPI validate
        run: make openapi-validate

      - name: OpenAPI drift check
        run: make openapi-diff

      - name: OpenAPI codegen
        run: make openapi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9
          working-directory: apps/api

      - name: Test
        run: make api-test

      - name: Build API image
        run: make api-docker-build IMAGE_TAG=ci-${{ github.sha }}

      - name: Build Varnish image
        run: make varnish-docker-build IMAGE_TAG=ci-${{ github.sha }}
