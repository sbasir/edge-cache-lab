services:
  api:
    build:
      context: ./apps/api
    environment:
      - INSTANCE_NAME=local-dev
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      varnish-net:
        aliases:
          - api

  varnish:
    build:
      context: ./apps/varnish
    ports:
      - "6081:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - varnish-net
    links:
      - api

networks:
  varnish-net:
    driver: bridge
