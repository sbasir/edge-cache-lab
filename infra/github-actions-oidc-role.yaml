AWSTemplateFormatVersion: "2010-09-09"
Resources:
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub GitHubActionsDeployRole-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: "repo:sbasir/edge-cache-lab:*"
      Policies:
        - PolicyName: PulumiDeploymentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:DescribeVpcs
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:DescribeSubnets
                  - ec2:CreateInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:DescribeInternetGateways
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:DescribeRouteTables
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DescribeSecurityGroups
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:DescribeInstances
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DescribeAvailabilityZones
                Resource: !Sub "arn:aws:ec2:*:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/edge-cache-lab-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:policy/edge-cache-lab-*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/edge-cache-lab/*"
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucket*
                  - s3:PutBucket*
                  - s3:ListBucket
                  - s3:ListAllMyBuckets
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::edge-cache-lab-*"
                  - !Sub "arn:aws:s3:::edge-cache-lab-*/*"
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource: 
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:instance/*"
                  - "arn:aws:ssm:*::document/AWS-RunShellScript"
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/edge-cache-lab-role"
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
Outputs:
  GitHubActionsRoleArn:
    Description: "ARN of the GitHub Actions Deploy Role"
    Value: !GetAtt GitHubActionsRole.Arn
