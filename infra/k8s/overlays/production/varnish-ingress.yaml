# Production Ingress Patch for Varnish
# This is an optional patch - use it to configure a specific hostname
# Replace 'api.example.com' with your actual domain

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: varnish
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # For HTTPS with cert-manager, uncomment and configure:
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # TLS section (optional - enable with cert-manager)
  # tls:
  #   - hosts:
  #       - api.example.com
  #     secretName: varnish-tls
  rules:
    # Remove the host field to accept any hostname
    - host: api.edge.sofybasir.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: varnish
                port:
                  number: 80
