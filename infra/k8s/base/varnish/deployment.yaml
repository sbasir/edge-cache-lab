apiVersion: apps/v1
kind: Deployment
metadata:
  name: varnish
spec:
  replicas: 1
  selector:
    matchLabels:
      app: varnish
  template:
    metadata:
      labels:
        app: varnish
    spec:
      containers:
        - name: varnish
          image: varnish:8-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: varnish-config
              mountPath: /etc/varnish/default.vcl
              subPath: default.vcl
          args:
            - "-F"
            - "-f"
            - "/etc/varnish/default.vcl"
            - "-a"
            - "http=:80,HTTP"
            - "-p"
            - "default_ttl=120"
      volumes:
        - name: varnish-config
          configMap:
            name: varnish-config
