# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
# .pinact.yaml — config for pinact (pins GitHub Actions to full commit SHAs).
# Run `pinact run` to rewrite `@v4` → `@<40-char-sha> # v4.x.y`.
# CI runs `pinact run` then `git diff --exit-code` to fail on any unpinned action.
version: 3
